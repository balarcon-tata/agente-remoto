<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agente Ingeniería Remoto V5.2</title><style>
:root{--w:#a7193f;--ink:#102542;--m:#65758c;--line:#dde5ef;--bg:#f3f6f9;--green:#15824b}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}.app{height:100vh;display:grid;grid-template-columns:31% 69%;overflow:hidden}.side{padding:22px;border-right:1px solid var(--line);overflow:auto}.brand{font-size:29px;font-weight:800}.muted{color:var(--m);font-size:13px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:20px 0}.card,.ctx{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.card small{font-weight:700;color:var(--m)}.card b{display:block;font-size:24px;margin-top:6px}.ctxrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef2f6;font-size:13px}.ctxrow:last-child{border:0}.main{height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#fff}.head{padding:17px 23px 11px;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:23px;font-weight:800}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#aeb9c7;margin-right:6px}.dot.on{background:var(--green)}.btn,.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 13px;cursor:pointer}.chips{display:flex;gap:8px;overflow:auto;margin-top:11px}.chip{white-space:nowrap}.chat{overflow-y:auto;padding:23px 28px;scroll-behavior:smooth}.turn{margin-bottom:21px}.user{display:flex;justify-content:flex-end}.bubble{background:var(--w);color:#fff;padding:13px 17px;border-radius:20px 20px 5px 20px;max-width:78%;line-height:1.4}.assistant{display:grid;grid-template-columns:35px minmax(0,1fr);gap:11px}.icon{width:33px;height:33px;border-radius:11px;background:var(--w);color:#fff;display:grid;place-items:center;font-weight:800}.ans{line-height:1.55;white-space:pre-wrap}.composer{padding:13px 22px 17px;border-top:1px solid var(--line)}.box{display:flex;align-items:flex-end;gap:10px;border:1px solid #ccd6e2;border-radius:21px;padding:11px 11px 11px 16px}textarea{flex:1;border:0;outline:0;resize:none;min-height:46px;max-height:120px;font:inherit}.send{width:47px;height:47px;border:0;border-radius:50%;background:var(--w);color:#fff;font-size:22px}.typing{display:flex;gap:5px;padding:8px}.typing i{width:7px;height:7px;border-radius:50%;background:#7c8ba0;animation:a .8s infinite alternate}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes a{to{opacity:.25;transform:translateY(-3px)}}.sideDash{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:13px}.sideTitle{font-weight:800;font-size:14px}.miniLegend{display:flex;gap:12px;color:var(--m);font-size:11px;margin:5px 0}.lg{width:15px;height:3px;border-radius:4px;display:inline-block}.lg.hc{background:#a7193f}.lg.units{background:#7b8798}.sideDash canvas{width:100%;height:140px}.sideDailyTable{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}.sideDay{text-align:center;border-top:1px solid #eef2f6;padding-top:5px;font-size:9px;color:var(--m)}.sideDay b{display:block;color:var(--ink);font-size:10px;margin-top:2px}.sideDay span{font-size:9px}.login{position:fixed;inset:0;background:rgba(243,246,249,.97);z-index:10;display:flex;align-items:center;justify-content:center}.loginBox{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.loginBox input{width:100%;padding:12px;border:1px solid #ccd6e2;border-radius:12px;margin:14px 0}@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}.bubble{max-width:90%}}
</style></head><body><div class="login" id="login"><div class="loginBox"><div class="brand">Agente Ingeniería</div><div class="muted">Especialista en el programa de Ensamble</div><input id="key" type="password" placeholder="Clave de acceso"><button class="btn" id="enter" style="width:100%;background:var(--w);color:#fff">Entrar</button><div class="muted" id="loginMsg" style="margin-top:9px"></div></div></div><div class="app"><aside class="side"><div class="brand">Agente Ingeniería</div><div class="muted">Especialista en el programa de Ensamble</div><div class="kpis"><div class="card"><small>UNIDADES SEMANA</small><b id="kU">-</b></div><div class="card"><small>HC PROMEDIO/DIA</small><b id="kH">-</b></div><div class="card"><small>HC PICO</small><b id="kL">-</b></div><div class="card"><small>LINEAS ACTIVAS</small><b id="kO">-</b></div></div><div class="sideDash"><div class="sideTitle">Balance por día</div><div class="miniLegend"><span><i class="lg hc"></i> HC</span><span><i class="lg units"></i> Unidades</span></div><canvas id="sideDailyChart"></canvas><div id="sideDailyTable" class="sideDailyTable"></div></div><div class="ctx"><b>Contexto activo</b><div id="ctx" style="margin-top:9px"></div></div></aside><section class="main"><header class="head"><div class="top"><div><div class="title">Consulta de Ingeniería</div><div class="muted"><span class="dot" id="dot"></span><span id="status">Cargando...</span></div></div><button class="btn" id="new">Nueva conversación</button></div><div class="chips"><button class="chip">Analiza Automatico el miercoles</button><button class="chip">Familia con mayor demanda</button><button class="chip">Operacion critica por dia</button><button class="chip">Orden de mayor volumen en Automatico</button><button class="chip">Compara Automatico y Tornillo</button></div></header><main class="chat" id="chat"></main><footer class="composer"><div class="box"><textarea id="q" placeholder="Pregunta algo del programa..."></textarea><button class="send" id="send">↑</button></div><div class="muted" style="margin-top:6px">Enter para enviar · Shift+Enter nueva linea</div></footer></section></div><script>
const REMOTE='https://ezhlltgcqektrclgzhfi.supabase.co/functions/v1/engineering-agent-remote',DATA='https://ezhlltgcqektrclgzhfi.supabase.co/functions/v1/engineering-agent-query',PUB='sb_publishable_QnmVt7kK6LTX6HqY3eJcUg_wTN-O6Hp';let access=localStorage.getItem('eng_remote_key')||'',session=localStorage.getItem('eng_remote_session')||crypto.randomUUID(),rows=[],memory={line:null,date:null,order:null,style:null,operation:null,metric:null};localStorage.setItem('eng_remote_session',session);const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:1}),chat=$('#chat');function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}function dayName(d){return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(d+'T00:00:00').getDay()]}
function user(t){const d=document.createElement('div');d.className='turn user';const b=document.createElement('div');b.className='bubble';b.textContent=t;d.appendChild(b);chat.appendChild(d);bottom()}function load(){const d=document.createElement('div');d.className='turn assistant';d.id='x'+Date.now();d.innerHTML='<div class="icon">I</div><div class="ans"><div class="typing"><i></i><i></i><i></i></div></div>';chat.appendChild(d);bottom();return d.id}function bot(t,id){let a=id?document.querySelector('#'+id+' .ans'):null;if(!a){const d=document.createElement('div');d.className='turn assistant';d.innerHTML='<div class="icon">I</div><div class="ans"></div>';chat.appendChild(d);a=d.querySelector('.ans')}a.textContent=t;bottom()}function bottom(){requestAnimationFrame(()=>chat.scrollTop=chat.scrollHeight)}
async function remote(body){const r=await fetch(REMOTE,{method:'POST',headers:{'Content-Type':'application/json','X-Agent-Key':access},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}async function loadRows(){const r=await fetch(DATA,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUB},body:'{"config_id":"default"}'});const j=await r.json();if(!j.ok)throw Error(j.error||'No se pudo cargar');rows=j.data||[];renderDash()}
function daily(){const m=new Map;for(const r of rows){const k=r.fecha;if(!m.has(k))m.set(k,{date:k,hc:0,units:0});const x=m.get(k);x.hc+=Number(r.hc||0);x.units+=Number(r.unidades||0)}return[...m.values()].sort((a,b)=>a.date.localeCompare(b.date))}function renderDash(){const d=daily();$('#kU').textContent=fmt(rows.reduce((s,r)=>s+Number(r.unidades||0),0));$('#kH').textContent=fmt(d.length?d.reduce((s,x)=>s+x.hc,0)/d.length:0);$('#kL').textContent=fmt(d.length?Math.max(...d.map(x=>x.hc)):0);$('#kO').textContent=new Set(rows.map(r=>r.linea)).size;draw(d);renderCtx()}function draw(d){const c=$('#sideDailyChart'),w=c.clientWidth||390,h=140,px=devicePixelRatio||1;c.width=w*px;c.height=h*px;const x=c.getContext('2d');x.scale(px,px);x.clearRect(0,0,w,h);if(!d.length)return;const p={l:24,r:10,t:10,b:22},iw=w-p.l-p.r,ih=h-p.t-p.b,maxH=Math.max(...d.map(z=>z.hc),1),maxU=Math.max(...d.map(z=>z.units),1);x.strokeStyle='#edf1f5';for(let i=0;i<3;i++){let y=p.t+ih*i/2;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke()}function plot(vals,max,color){const pts=vals.map((v,i)=>({x:p.l+(d.length===1?iw/2:iw*i/(d.length-1)),y:p.t+ih-v/max*ih}));x.strokeStyle=color;x.lineWidth=2;x.beginPath();pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.stroke();pts.forEach(q=>{x.fillStyle=color;x.beginPath();x.arc(q.x,q.y,2.5,0,Math.PI*2);x.fill()})}plot(d.map(z=>z.hc),maxH,'#a7193f');plot(d.map(z=>z.units),maxU,'#7b8798');x.fillStyle='#65758c';x.font='9px Segoe UI';x.textAlign='center';d.forEach((z,i)=>{const xx=p.l+(d.length===1?iw/2:iw*i/(d.length-1));x.fillText(dayName(z.date).slice(0,3),xx,h-6)});$('#sideDailyTable').innerHTML=d.map(z=>`<div class="sideDay">${dayName(z.date).slice(0,3)}<b>${fmt(z.hc)} HC</b><span>${fmt(z.units)} un.</span></div>`).join('')}
function updateMemory(q){const n=norm(q),lines=[...new Set(rows.map(r=>r.linea))];for(const l of lines){const name=norm(l).replace(/^\d+\s*/,'');if(name&&n.includes(name))memory.line=l}const aliases=[['AUTOMATIC','AUTOMATIC'],['TORNILLO','TORNILLO'],['METALICO','MET'],['WEBB','WEBB'],['OCULTA','OCULTA']];for(const [a,p] of aliases)if(n.includes(a)){const l=lines.find(x=>norm(x).includes(p));if(l)memory.line=l}for(const r of rows){const dn=norm(dayName(r.fecha));if(n.includes(dn))memory.date=r.fecha}const om=n.match(/\b[TA]\d{5,}\b/);if(om)memory.order=om[0];if(n.includes('UNIDAD')||n.includes('DEMANDA'))memory.metric='units';else if(n.includes('HC'))memory.metric='hc';renderCtx()}function renderCtx(){$('#ctx').innerHTML=[['Linea',memory.line],['Dia',memory.date?dayName(memory.date):null],['Orden',memory.order],['Estilo',memory.style],['Operacion',memory.operation],['Metrica',memory.metric]].map(x=>`<div class="ctxrow"><span>${x[0]}</span><b>${x[1]||'-'}</b></div>`).join('')}
async function status(){try{const j=await remote({action:'status'});$('#dot').classList.toggle('on',!!j.worker_online);$('#status').textContent=j.worker_online?'Listo · remoto + análisis de ingeniería activos':'PC principal desconectada'}catch{$('#status').textContent='Sin conexión'}}async function ask(text){text=text.trim();if(!text)return;user(text);updateMemory(text);const id=load();try{const s=await remote({action:'submit',session_id:session,question:text});for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,1000));const p=await remote({action:'poll',id:s.id});if(p.status==='done'){bot(p.answer||'Sin respuesta.',id);return}if(p.status==='error'){bot('No se pudo completar la consulta. Revisa que el worker V5.2 esté abierto.',id);return}if(i===10)bot('La PC principal está procesando la consulta...',id)}bot('Tiempo de espera agotado.',id)}catch(e){bot('No se pudo enviar la consulta: '+e.message,id)}}async function doLogin(){access=$('#key').value.trim();try{await remote({action:'status'});localStorage.setItem('eng_remote_key',access);$('#login').style.display='none';await Promise.all([status(),loadRows()]);bot('Listo. Puedo consultar el programa por día, línea, orden, estilo u operación; comparar, desglosar y explicar causas. Mantendré el alcance de la conversación.')}catch(e){$('#loginMsg').textContent='Clave incorrecta o servicio no disponible.'}}
$('#enter').onclick=doLogin;$('#key').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('#send').onclick=()=>{const t=$('#q').value;$('#q').value='';ask(t)};$('#q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click()}};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>ask(b.textContent));$('#new').onclick=()=>{session=crypto.randomUUID();localStorage.setItem('eng_remote_session',session);memory={line:null,date:null,order:null,style:null,operation:null,metric:null};chat.innerHTML='';renderCtx();bot('Nueva conversación. ¿Qué quieres analizar?')};if(access){$('#login').style.display='none';Promise.all([status(),loadRows()]).then(()=>bot('Listo. Puedo consultar el programa por día, línea, orden, estilo u operación; comparar, desglosar y explicar causas. Mantendré el alcance de la conversación.')).catch(e=>bot('No pude cargar el programa: '+e.message))}setInterval(status,15000);
</script></body></html>
